# Servidor de la Clínica UNER
# - Sirve el build de Angular (frontend)
# - Redirige /api al backend NestJS que corre con PM2 en el puerto 3000
#
# Antes de usarlo, cambiar "root" por la ruta absoluta al build del frontend.
# Windows: root E:/ruta/al/repo/frontend/dist/frontend/browser;
# Linux:   root /var/www/clinica/frontend/dist/frontend/browser;

server {
    listen 8080;
    server_name localhost;

    root C:/clinica-uner/frontend/dist/frontend/browser;
    index index.html;

    # API -> backend (se mantiene el prefijo /api)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular: cualquier ruta que no sea un archivo vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
